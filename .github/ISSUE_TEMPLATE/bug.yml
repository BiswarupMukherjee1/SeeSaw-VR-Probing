name: Bug
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Quest 3 + sidecar over Wi-Fi, Desktop mode + sidecar, Desktop mode + RGB backend]
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or branch
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
